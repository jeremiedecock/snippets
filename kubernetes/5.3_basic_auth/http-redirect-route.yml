# Answer every plain HTTP request with a 301 to the HTTPS one, as any site
# served over HTTPS does.
#
# This route coexists with the temporary ACME solver HTTPRoute on the same
# listener, and does not hide it: the solver matches the challenge path
# exactly (`/.well-known/acme-challenge/<token>`), and the Gateway API gives
# an Exact path match precedence over the catch-all prefix below, across
# routes. So the challenge is answered, everything else is redirected.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-redirect-route
spec:
  parentRefs:
    - name: my-gateway
      sectionName: http
  hostnames:
    - my-app.example.com
  rules:
    # No backendRefs: the Gateway answers by itself, nothing reaches the app.
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
