# Unchanged from 5.2_lets_encrypt. The password check is not expressed here:
# it is attached from the outside by security-policy.yml, which targets this
# route by name.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-route
spec:
  parentRefs:
    - name: my-gateway
      # Attach to the HTTPS listener only: the HTTP one carries the ACME
      # challenge and the redirect.
      sectionName: https
  hostnames:
    - my-app.example.com
  rules:
    - backendRefs:
        - name: my-service
          port: 80
      # matches:
      #   - path:
      #       type: PathPrefix
      #       value: /
