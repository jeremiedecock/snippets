# The only file in this repo that mentions the secret at all — and it holds a
# *reference*, never a value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hello
spec:
  # How often ESO re-reads the remote value. Rotating the secret in OVHcloud
  # Secret Manager propagates here without touching git or redeploying.
  refreshInterval: 1h
  secretStoreRef:
    name: ovh-secret-manager
    kind: ClusterSecretStore
  target:
    # The Kubernetes Secret ESO will create and keep in sync. Naming it `hello`
    # with a `token` key is what lets deployment.yml stay byte-for-byte
    # identical to the one in 9_secret_base64.
    name: hello
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        # Path of the secret inside Secret Manager, and the field to read.
        key: hello
        property: token
