# How ESO reaches OVHcloud Secret Manager. `ClusterSecretStore` is
# cluster-scoped (a plain `SecretStore` would be limited to one namespace).
#
# This variant uses ESO's purpose-built `ovh` provider. See
# clustersecretstore-vault.yml for the Vault-compatible alternative.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: ovh-secret-manager
spec:
  provider:
    ovh:
      # Region of your OKMS domain — `ovhcloud okms list` gives region and id.
      server: https://eu-west-par.okms.ovh.net
      okmsid: REPLACE_WITH_YOUR_OKMS_ID
      auth:
        # The Personal Access Token, created imperatively (see README) so it
        # never lands in git. `mtls:` is the stronger alternative: a client
        # certificate instead of a long-lived bearer token.
        token:
          tokenSecretRef:
            name: ovh-token
            key: token
            namespace: external-secrets
