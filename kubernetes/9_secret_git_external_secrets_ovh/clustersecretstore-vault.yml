# Alternative to clustersecretstore.yml — apply one or the other, not both.
#
# OVHcloud Secret Manager exposes an API compatible with HashiCorp Vault's KV
# v2 engine, so ESO's long-standing `vault` provider works against it. This is
# the path OVHcloud's own documentation describes; it is also what you would
# reuse verbatim if you ever moved to a real Vault.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: ovh-secret-manager
spec:
  provider:
    vault:
      # Note the different endpoint shape: the OKMS id is part of the path.
      server: https://eu-west-par.okms.ovh.net/api/REPLACE_WITH_YOUR_OKMS_ID
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: ovh-token
          key: token
          namespace: external-secrets
