apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - image: docker.io/library/nginx:stable-alpine-slim
          name: my-container
          env:
            - name: HELLO
              valueFrom:
                configMapKeyRef:
                  name: my-config-map
                  key: message1