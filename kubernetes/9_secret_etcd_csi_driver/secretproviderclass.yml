apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: my-secret-provider-class
spec:
  provider: vault
  parameters:
    roleName: my-role
    vaultAddress: http://vault.default.svc.cluster.local:8200
    # One entry per secret to expose. `objectName` becomes the *filename* in
    # the mounted volume. `secretPath` is Vault's raw API path: with the KV v2
    # engine that means `secret/data/...`, not `secret/...`.
    objects: |
      - objectName: token
        secretPath: secret/data/my-app
        secretKey: token
  # Deliberately NOT set: `secretObjects`, which would sync the value into a
  # regular Kubernetes Secret — putting it back into etcd and defeating the
  # entire point of this example.
