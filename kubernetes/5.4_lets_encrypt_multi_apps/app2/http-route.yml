apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-route
  namespace: snippet-letsencrypt-multi-demo-app2
spec:
  hostnames:
    - "app2.example.com"
  parentRefs:
    - name: my-gateway
      namespace: snippet-letsencrypt-multi-demo-gateway   # Use "gateway-infra" in production
      # No longer optional: the Gateway has four listeners, and this route
      # must land on the HTTPS one of *this* application.
      sectionName: https-app2
  rules:
    - backendRefs:
        - name: my-service
          port: 80
      # matches:
