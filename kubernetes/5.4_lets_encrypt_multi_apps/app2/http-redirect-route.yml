# The 301 to HTTPS for this application's hostname, as in 5.2_lets_encrypt.
# It belongs to the application rather than to the Gateway: one hostname, one
# team, one set of routes. It shares the `http-app2` listener with the
# temporary ACME solver route, which wins on the challenge path because an
# Exact path match takes precedence over this catch-all.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-redirect-route
  namespace: snippet-letsencrypt-multi-demo-app2
spec:
  hostnames:
    - "app2.example.com"
  parentRefs:
    - name: my-gateway
      namespace: snippet-letsencrypt-multi-demo-gateway   # Use "gateway-infra" in production
      sectionName: http-app2
  rules:
    # No backendRefs: the Gateway answers by itself, nothing reaches the app.
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
