# An Issuer tells cert-manager *where* certificates come from and *how* to
# prove the domain is yours. Two of them here, pointing at the two Let's
# Encrypt environments: always start with the staging one, whose rate limits
# are loose, and switch to the production one once it works.
#
# ClusterIssuer (used here) is cluster-scoped and usable from any namespace;
# Issuer is the namespaced equivalent, referenced with the
# `cert-manager.io/issuer` annotation instead.

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # The ACME directory of the Let's Encrypt *staging* environment. It signs
    # with an untrusted root, so browsers still complain, but it is there to
    # be hammered while debugging.
    server: https://acme-staging-v02.api.letsencrypt.org/directory

    # Contact address of the ACME account. Let's Encrypt uses it for expiry
    # warnings and problem notifications. Put a real one here.
    email: you@example.com

    # Where cert-manager stores the *account* private key it creates on first
    # use (not the certificate key). The Secret lives in the namespace where
    # cert-manager runs, because a ClusterIssuer has no namespace of its own.
    privateKeySecretRef:
      name: letsencrypt-staging-account-key

    solvers:
      # HTTP-01: prove control of the domain by serving a token at
      # http://<domain>/.well-known/acme-challenge/<token>. cert-manager
      # creates a temporary Pod, Service and HTTPRoute, lets the ACME server
      # fetch the token, then deletes all three.
      - http01:
          # The Gateway API flavour of the solver: the temporary HTTPRoute is
          # attached to this Gateway, which must have a listener on port 80.
          # (The Ingress flavour, `http01.ingress`, is the one used with the
          # legacy Ingress API.)
          gatewayHTTPRoute:
            parentRefs:
              - kind: Gateway
                name: my-gateway
                namespace: snippet-backend-letsencrypt-demo
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    # Same thing against the real Let's Encrypt, which issues publicly trusted
    # certificates — and enforces much stricter rate limits.
    server: https://acme-v02.api.letsencrypt.org/directory
    email: you@example.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - kind: Gateway
                name: my-gateway
                namespace: snippet-backend-letsencrypt-demo
