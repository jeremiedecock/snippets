apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-route
spec:
  parentRefs:
    - name: my-gateway
      # Attach to the HTTPS listener only: the HTTP one is handled by
      # http-redirect-route.yml. Without sectionName, the route would attach
      # to every compatible listener of the Gateway.
      sectionName: https
  # Must be compatible with the listener hostname (here, identical).
  hostnames:
    - my-app.example.com
  rules:
    - backendRefs:
        - name: my-service
          port: 80
      # matches:
      #   - path:
      #       type: PathPrefix
      #       value: /
