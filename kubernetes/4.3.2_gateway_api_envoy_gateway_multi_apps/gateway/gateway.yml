apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: my-gateway
  namespace: snippet-gatewayapi-demo-gateway   # Use "gateway-infra" in production
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        # Which namespaces may attach their HTTPRoutes to this listener.
        # Unlike Ingress, the Gateway API lets the cluster operator control
        # this: "All" (any namespace), "Same" (this namespace only), or
        # "Selector" (namespaces matching a label).
        #
        # "All" keeps this demo simple. In production, prefer an opt-in
        # selector, and label the allowed namespaces accordingly:
        #
        #   namespaces:
        #     from: Selector
        #     selector:
        #       matchLabels:
        #         shared-gateway-access: "true"
        namespaces:
          from: All
