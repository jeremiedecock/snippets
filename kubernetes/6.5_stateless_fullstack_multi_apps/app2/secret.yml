# The registry pull Secret, as a manifest, **for reference only** -- it holds
# a password in clear text and is not meant to be applied or committed. The
# README creates it with `kubectl create secret docker-registry` instead.
#
# What is new compared to 6.4: there are now *two* of these, one per
# application namespace, with identical contents. A pull Secret is a
# **namespaced** object and the kubelet only looks for it in the namespace of
# the Pod that references it, so a single Secret cannot be shared across
# namespaces -- it has to be created in each of them. (Which is why a cluster
# with many namespaces pulling from one registry usually ends up automating
# this: a Secret replicator, or an image pull credential provider.)
#
# Still one Secret per *namespace* rather than per image, though: the
# credentials belong to the registry, so the same one serves both the backend
# and the frontend image.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: snippet-fullstack-multi-demo-app2
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "jeremiedecock",
          "password": "ghp_..."
        }
      }
    }
