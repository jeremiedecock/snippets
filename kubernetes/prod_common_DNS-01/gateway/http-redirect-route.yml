# One redirect for every application: 301 http -> https on every hostname the
# `http` listener accepts. No `hostnames:` field means "the listener's
# hostname", i.e. `*.example.com`.
#
# Because this exists, an application deploys a single HTTPRoute of its own.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: gateway-infra
spec:
  parentRefs:
    - name: gateway-infra
      sectionName: http
  rules:
    # No backendRefs: the Gateway answers by itself.
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
