# The only part of acme-dns that faces the internet. Needs a STABLE PUBLIC IP
# (a DNS delegation cannot point at a CNAME) reachable on UDP and TCP 53.
apiVersion: v1
kind: Service
metadata:
  name: acme-dns
  namespace: acme-dns
spec:
  type: LoadBalancer
  selector:
    app: acme-dns
  ports:
    # Mixed-protocol Services need a load balancer that supports them. If
    # this Service never gets an address, split it in two (one UDP, one TCP).
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
