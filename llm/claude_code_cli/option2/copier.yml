# Copier template configuration — containerized Claude Code, OPTION 2:
# long-lived OAuth token (`claude setup-token`), per-project state.
#
# See README.md for usage, and https://copier.readthedocs.io/ for Copier.

_min_copier_version: "9.0.0"

# Only the content of template/ is rendered into the destination project;
# this file and README.md are not copied.
_subdirectory: template

_message_after_copy: |

  Containerized Claude Code environment generated (option 2: long-lived token).

  Next steps:
    1. If not done yet (once, for ALL projects):  ./claude.sh --setup-token
    2. cd into the project and run:               ./claude.sh
       (the first run builds the image — a few minutes)

project_name:
  type: str
  help: >-
    Project name — used for the container image name, the container hostname
    and the state volume name (lowercase letters, digits, '-', '_', '.')
  placeholder: my-project
  validator: >-
    {% if not (project_name | regex_search('^[a-z0-9][a-z0-9_.-]*$')) %}
    Must start with a lowercase letter or digit and contain only lowercase
    letters, digits, '-', '_' and '.' (e.g. my-project)
    {% endif %}

image_name:
  type: str
  help: >-
    Container image name. Each project builds its own image by default; point
    several projects at the same name to share one image.
  default: "localhost/{{ project_name }}:latest"

state_volume:
  type: str
  help: >-
    Per-project Podman volume holding Claude Code state (history, sessions,
    folder trust, settings) — isolated from other projects. Authentication
    itself comes from the shared token, not from this volume.
  default: "{{ project_name }}-claude"

token_file:
  type: str
  help: >-
    Host file holding the long-lived OAuth token generated by
    `claude setup-token` (a shell expression, evaluated when claude.sh runs).
    Shared by all projects.
  default: "${XDG_CONFIG_HOME:-${HOME}/.config}/claude-containers/token"
